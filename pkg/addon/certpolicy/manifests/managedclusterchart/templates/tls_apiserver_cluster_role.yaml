# Grants read access to the cluster APIServer TLS profile so the controller can apply its TLS
# groups and watch for profile changes on OpenShift. The cert policy cluster role is narrow in
# non-Hosted mode too, so this is needed in both modes.

{{- if eq .Values.hostingKubernetesDistribution "OpenShift" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-cluster-management:{{ include "controller.tlsapiserverrolename" . }}
  labels:
    app: {{ include "controller.fullname" . }}
    chart: {{ include "controller.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    addon.open-cluster-management.io/hosted-manifest-location: hosting
rules:
- apiGroups:
  - config.openshift.io
  resources:
  - apiservers
  verbs:
  - get
  - list
  - watch
{{- end }}
